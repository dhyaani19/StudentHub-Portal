<!DOCTYPE html>
<html>

<head>
    <title>Profile</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Student Hub Portal</h1>
    </header>

    <nav>
        <a href="../index.html">Home</a>
        <a href="syllabus.html">Syllabus</a>
        <a href="Extracurricular.html">Extracurricular</a>
        <a href="E-Governance.html">E-Governance</a>
        <a href="attendance.html">Attendance</a>
        <a href="timetable.html">Time Table</a>
        <a href="result.html">Result</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
    </nav>

    <div class="container">

        <div class="card">

            <h2>Student Profile</h2>

            <label>Name</label>
            <br>
            <input type="text" id="profileName"
                oninput="clearError('profileName', 'nameError')">
            <p id="nameError"></p>

            <label>Enrolment No</label>
            <br>
            <input type="text" id="profileEnrollment"
                oninput="clearError('profileEnrollment', 'enrollmentError')">
            <p id="enrollmentError"></p>

            <label>Course</label>
            <br>
            <input type="text" value="B.Tech CE" readonly>
            <br><br>

            <label>Current Semester</label>
            <br>
            <input type="text" value="3" readonly>
            <br><br>

            <label>Email</label>
            <br>
            <input type="email" id="profileEmail"
                oninput="clearError('profileEmail', 'emailError')">
            <p id="emailError"></p>

            <button onclick="saveProfile()">Save Profile</button>

        </div>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
